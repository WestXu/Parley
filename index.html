<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1d232a">
  <link rel="stylesheet" href="/src/style.css">
  <title>Translate</title>
</head>

<body class="bg-base-100 text-base-content overflow-hidden h-dvh font-sans">
  <main class="grid grid-rows-2 h-dvh divide-y divide-base-300">
    <section id="pane-other" class="pane overflow-y-auto px-4 pt-3 pb-3"></section>
    <section id="pane-en" class="pane overflow-y-auto px-4 pt-3 pb-3"></section>
  </main>

  <button id="swap" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 btn btn-circle btn-sm bg-base-200 border-base-300 shadow-lg z-10" aria-label="swap panes">⇅</button>

  <div id="bar" class="fixed inset-x-0 bottom-4 flex justify-center pointer-events-none">
    <div class="flex items-center gap-3 bg-base-200 border border-base-300 rounded-full px-4 py-2 shadow-lg pointer-events-auto">
      <span id="status-dot" class="status status-sm status-neutral"></span>
      <span id="status" class="text-sm opacity-70">idle</span>
      <select id="lang" class="select select-sm select-ghost w-auto">
        <option value="zh">中文</option>
        <option value="vi">Tiếng Việt</option>
        <option value="ja">日本語</option>
      </select>
      <button id="start" class="btn btn-sm btn-primary">Start</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
