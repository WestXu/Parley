<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d232a" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/src/style.css">
  <title>Translate</title>
</head>

<body class="bg-base-100 text-base-content overflow-hidden h-screen font-sans">
  <main class="grid grid-rows-2 landscape:grid-rows-1 landscape:grid-cols-2 h-screen gap-2 bg-base-300">
    <section id="pane-a" class="pane is-top overflow-y-auto px-4 pt-3 pb-3 bg-base-100"></section>
    <section id="pane-b" class="pane is-bottom overflow-y-auto px-4 pt-3 pb-3 bg-base-100"></section>
  </main>

  <button id="swap"
    class="fixed top-[50vh] left-1/2 -translate-x-1/2 -translate-y-1/2 landscape:rotate-90 btn btn-circle btn-sm bg-base-200 border-base-300 shadow-lg z-10"
    aria-label="swap panes">⇅</button>

  <button id="rotate"
    class="fixed top-[env(safe-area-inset-top)] right-2 landscape:hidden btn btn-circle btn-sm bg-base-200 border-base-300 shadow-lg z-10 text-xl leading-none"
    aria-label="rotate top pane">⟲</button>

  <div id="bar"
    class="fixed inset-x-0 top-0 h-screen pb-[env(safe-area-inset-bottom)] flex items-end justify-center pointer-events-none">
    <div
      class="flex items-center gap-3 bg-base-200 border border-base-300 rounded-full px-4 py-2 shadow-lg pointer-events-auto">
      <select id="lang-a" class="select select-sm select-ghost w-auto">
        <option value="en" selected>English</option>
        <option value="zh">中文</option>
        <option value="vi">Tiếng Việt</option>
        <option value="ja">日本語</option>
        <option value="th">ไทย</option>
      </select>
      <button id="swap-langs" class="btn btn-sm btn-ghost btn-circle text-sm" aria-label="swap languages">↔</button>
      <select id="lang-b" class="select select-sm select-ghost w-auto">
        <option value="en">English</option>
        <option value="zh" selected>中文</option>
        <option value="vi">Tiếng Việt</option>
        <option value="ja">日本語</option>
        <option value="th">ไทย</option>
      </select>
      <button id="ep" class="btn btn-sm btn-circle btn-ghost" aria-label="toggle earphones mode"
        title="Earphones mode: auto-play translation in opposite ear">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6" />
          <path d="M21 19a2 2 0 0 1-2 2h-1v-6h3v4z" />
          <path d="M3 19a2 2 0 0 0 2 2h1v-6H3v4z" />
        </svg>
      </button>
      <button id="start" class="btn btn-md btn-circle" aria-label="start translation">
        <svg class="i-play" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
        <svg class="i-stop" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2" />
        </svg>
      </button>
    </div>
  </div>

  <div id="toast" class="fixed inset-x-0 z-20 flex flex-col items-center gap-2 px-4 pointer-events-none"
    style="bottom: calc(6rem + env(safe-area-inset-bottom))"></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
