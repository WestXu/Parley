<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1d232a">
  <link rel="stylesheet" href="/src/style.css">
  <title>Translate</title>
</head>

<body class="bg-base-100 text-base-content overflow-hidden h-dvh font-sans">
  <main class="grid grid-rows-2 h-dvh">
    <section data-side="vi" class="side flipped grid grid-cols-2 gap-3 p-4 border-b border-base-300">
      <div class="pane" data-pane="vi-you">
        <div class="pane-label">Bạn nói</div>
        <div class="pane-body" data-body="vi-you"></div>
      </div>
      <div class="pane" data-pane="vi-them">
        <div class="pane-label">Họ nói</div>
        <div class="pane-body" data-body="vi-them"></div>
      </div>
    </section>
    <section data-side="en" class="side grid grid-cols-2 gap-3 p-4">
      <div class="pane" data-pane="en-them">
        <div class="pane-label">They said</div>
        <div class="pane-body" data-body="en-them"></div>
      </div>
      <div class="pane" data-pane="en-you">
        <div class="pane-label">You said</div>
        <div class="pane-body" data-body="en-you"></div>
      </div>
    </section>
  </main>

  <div id="bar" class="fixed inset-x-0 top-1/2 -translate-y-1/2 flex justify-center pointer-events-none">
    <div class="flex items-center gap-3 bg-base-200/90 backdrop-blur rounded-full px-4 py-2 shadow pointer-events-auto">
      <span id="status" class="text-sm opacity-70">idle</span>
      <button id="start" class="btn btn-sm btn-primary">Start</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
